name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  binaries:
    name: release archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/release.sh --version "${VERSION#v}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  image:
    name: container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Resolve build metadata
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf 'version=%s\n' "${RELEASE_TAG#v}" >>"${GITHUB_OUTPUT}"
          printf 'date=%s\n' "$(git show -s --format=%cI "${GITHUB_SHA}")" >>"${GITHUB_OUTPUT}"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rememorio/gofer:${{ github.ref_name }}
            ghcr.io/rememorio/gofer:latest
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.source.outputs.date }}
