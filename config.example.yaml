config_version: 1
log_level: info

server:
  address: 127.0.0.1:8001

runtime:
  max_turns: 100
  max_parallel_tools: 8
  max_subagents: 8
  max_subagent_depth: 4
  event_buffer: 128
  max_context_tokens: 120000
  reserve_tokens: 8000
  min_recent_messages: 8
  max_summary_chars: 20000

loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
  tool_freq_overrides: {}

# Require the agent to read the current version of an existing file before
# every write_file or str_replace operation. New files are unaffected.
read_before_write:
  enabled: true

tool_output:
  enabled: true
  externalize_min_chars: 12000
  preview_head_chars: 2000
  preview_tail_chars: 1000
  fallback_max_chars: 30000
  fallback_head_chars: 8000
  fallback_tail_chars: 3000
  storage_subdir: .tool-results
  exempt_tools: [read_file, read_file_tool]
  tool_overrides: {}

storage:
  driver: sqlite
  dsn: .gofer/gofer.db

workspace:
  root: .gofer/workspaces
  max_read_bytes: 1048576
  max_write_bytes: 81920
  max_upload_bytes: 33554432

# Upload batches are bounded separately from each file. Host-side Office/PDF
# conversion is disabled by default because document parsers process untrusted
# input. When enabled, the argv runs directly without a shell and must emit
# UTF-8 Markdown on stdout; {input} expands to a private temporary file.
uploads:
  max_files: 10
  max_total_bytes: 104857600
  auto_convert_documents: false
  converter_command: [markitdown, "{input}"]
  conversion_timeout_seconds: 120
  max_converted_bytes: 1048576
  max_context_files: 10
  max_context_chars: 50000
  max_outline_entries: 50
  max_preview_lines: 5

sandbox:
  driver: local
  # Local command execution is disabled unless explicitly trusted.
  allow_host_execution: false
  docker_binary: docker
  network_enabled: false
  command_timeout_seconds: 600
  max_timeout_seconds: 3600
  max_output_bytes: 1048576
  max_script_bytes: 65536
  memory: 1g
  cpus: 2
  pids_limit: 256

browser:
  enabled: false
  headful: false
  allow_private_addresses: false
  max_sessions: 32
  idle_timeout_seconds: 1800
  action_timeout_seconds: 30
  viewport_width: 1280
  viewport_height: 720

# Bounded web research is opt-in. Brave requires an API key; SearXNG requires
# an endpoint such as https://search.example.com. Fetch accepts textual HTTP(S)
# documents only and blocks private/reserved destinations by default.
web:
  search:
    enabled: false
    provider: brave
    # api_key: $BRAVE_SEARCH_API_KEY
    max_results: 5
    timeout_seconds: 15
    safe_search: moderate
    allow_private_addresses: false
  fetch:
    enabled: false
    max_response_bytes: 2097152
    max_content_chars: 20000
    timeout_seconds: 20
    max_redirects: 5
    user_agent: Gofer/1.0 (+https://github.com/Rememorio/gofer)
    allow_private_addresses: false

skills:
  enabled: false
  root: skills
  projection_root: .gofer/skills
  max_document_bytes: 1048576
  max_package_bytes: 10485760

mcp:
  enabled: false
  servers: []

memory:
  enabled: true
  limit: 5
  max_chars: 8192

auth:
  enabled: false
  tokens: []

scheduler:
  enabled: false
  poll_interval_seconds: 5
  lease_duration_seconds: 300
  batch_size: 32

channels:
  enabled: false
  max_inflight: 32
  queue_capacity: 128
  dedupe_ttl_seconds: 86400
  unauthorized_reply: This channel identity is not connected to Gofer.
  bindings: []
  # bindings:
  #   - user_id: local
  #     provider: webhook
  #     workspace_id: example
  #     external_user_id: user-123
  webhook:
    enabled: false
    secret: ""
    outbound_url: ""
    timeout_seconds: 10
    max_attempts: 3
    max_body_bytes: 1048576
    clock_skew_seconds: 300
    allow_private_addresses: false
  # Slack Socket Mode needs both a bot token (xoxb-...) and an app token
  # (xapp-...) with connections:write.
  slack:
    enabled: false
    bot_token: ""
    app_token: ""
    bot_user_id: ""
    allowed_users: []
    request_timeout_seconds: 20
    max_attempts: 3
  # Telegram uses long polling, so no public callback URL is required.
  telegram:
    enabled: false
    bot_token: ""
    allowed_users: []
    poll_timeout_seconds: 30
    request_timeout_seconds: 45
    max_attempts: 3
  # Discord uses Gateway v10. Enable the Message Content intent for the bot.
  discord:
    enabled: false
    bot_token: ""
    allowed_guilds: []
    allowed_channels: []
    mention_only: false
    thread_mode: false
    request_timeout_seconds: 20
    max_attempts: 3

# Empty conversations receive a bounded local title after their first user
# turn. Set model_name to use a configured model alias instead; failures still
# fall back locally and never overwrite a manually assigned title.
title:
  enabled: true
  max_words: 6
  max_chars: 60
  # model_name: primary

suggestions:
  enabled: true
  max_suggestions: 3

input_polish:
  enabled: true
  max_chars: 4000
  # model_name: primary

models:
  - name: primary
    provider: openai
    model: gpt-5
    api_key: $OPENAI_API_KEY
    options:
      display_name: GPT-5
      supports_thinking: true
      supports_vision: true

  # Native Anthropic Messages API example. Use api_key for X-Api-Key auth, or
  # auth_token for Bearer auth; never configure both.
  # - name: claude
  #   provider: anthropic
  #   model: claude-sonnet-4-6
  #   api_key: $ANTHROPIC_API_KEY
  #   max_tokens: 8192
  #   options:
  #     display_name: Claude Sonnet
  #     supports_thinking: true
  #     supports_vision: true
