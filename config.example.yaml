config_version: 1
log_level: info

server:
  address: 127.0.0.1:8001

runtime:
  max_turns: 100
  max_parallel_tools: 8
  max_subagents: 8
  max_subagent_depth: 4
  event_buffer: 128
  max_context_tokens: 120000
  reserve_tokens: 8000
  min_recent_messages: 8
  max_summary_chars: 20000

loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
  tool_freq_overrides: {}

# Require the agent to read the current version of an existing file before
# every write_file or str_replace operation. New files are unaffected.
read_before_write:
  enabled: true

tool_output:
  enabled: true
  externalize_min_chars: 12000
  preview_head_chars: 2000
  preview_tail_chars: 1000
  fallback_max_chars: 30000
  fallback_head_chars: 8000
  fallback_tail_chars: 3000
  storage_subdir: .tool-results
  exempt_tools: [read_file, read_file_tool]
  tool_overrides: {}

storage:
  driver: sqlite
  dsn: .gofer/gofer.db

workspace:
  root: .gofer/workspaces
  max_read_bytes: 1048576
  max_write_bytes: 81920
  max_upload_bytes: 33554432

sandbox:
  driver: local
  # Local command execution is disabled unless explicitly trusted.
  allow_host_execution: false
  docker_binary: docker
  network_enabled: false
  command_timeout_seconds: 600
  max_timeout_seconds: 3600
  max_output_bytes: 1048576
  max_script_bytes: 65536
  memory: 1g
  cpus: 2
  pids_limit: 256

browser:
  enabled: false
  headful: false
  allow_private_addresses: false
  max_sessions: 32
  idle_timeout_seconds: 1800
  action_timeout_seconds: 30
  viewport_width: 1280
  viewport_height: 720

skills:
  enabled: false
  root: skills
  projection_root: .gofer/skills
  max_document_bytes: 1048576
  max_package_bytes: 10485760

mcp:
  enabled: false
  servers: []

memory:
  enabled: true
  limit: 5
  max_chars: 8192

auth:
  enabled: false
  tokens: []

scheduler:
  enabled: false
  poll_interval_seconds: 5
  lease_duration_seconds: 300
  batch_size: 32

channels:
  enabled: false
  max_inflight: 32
  dedupe_ttl_seconds: 86400

models:
  - name: primary
    provider: openai
    model: gpt-5
    api_key: $OPENAI_API_KEY
    options:
      display_name: GPT-5
      supports_thinking: true
      supports_vision: true
