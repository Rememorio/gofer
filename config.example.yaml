config_version: 1
log_level: info

server:
  address: 127.0.0.1:8001

runtime:
  max_turns: 100
  max_parallel_tools: 8
  max_subagents: 8
  event_buffer: 128

storage:
  driver: sqlite
  dsn: .gofer/gofer.db

sandbox:
  driver: local
  # Local command execution is disabled unless explicitly trusted.
  allow_host_execution: false
  docker_binary: docker
  network_enabled: false
  command_timeout_seconds: 600
  max_timeout_seconds: 3600
  max_output_bytes: 1048576
  max_script_bytes: 65536
  memory: 1g
  cpus: 2
  pids_limit: 256

models:
  - name: primary
    provider: openai
    model: gpt-5
    api_key: $OPENAI_API_KEY
